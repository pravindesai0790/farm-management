<div class="date-time-picker-row">
  <!-- Date Field with Material Datepicker -->
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="picker-date-field">
    <mat-label>{{ dateLabel || (label + ' (Date)') }}</mat-label>
    <input
      matInput
      [matDatepicker]="datePicker"
      [value]="selectedDate()"
      (dateChange)="onDateChange($event.value)"
      [max]="maxDate"
      [min]="minDate"
      [disabled]="isDisabled()"
      [required]="required"
      placeholder="MM/DD/YYYY"
    />
    <mat-datepicker-toggle matIconSuffix [for]="datePicker" [disabled]="isDisabled()"></mat-datepicker-toggle>
    <mat-datepicker #datePicker></mat-datepicker>
  </mat-form-field>

  <!-- Time Field with Material Timepicker -->
  <mat-form-field appearance="outline" subscriptSizing="dynamic" class="picker-time-field">
    <mat-label>{{ timeLabel }}</mat-label>
    <input
      matInput
      [matTimepicker]="timePicker"
      [value]="selectedTimeDate()"
      (valueChange)="onTimeChange($event)"
      [disabled]="isDisabled()"
      [required]="required"
      placeholder="hh:mm"
    />
    <mat-timepicker-toggle matIconSuffix [for]="timePicker" [disabled]="isDisabled()"></mat-timepicker-toggle>
    <mat-timepicker #timePicker [interval]="interval"></mat-timepicker>
  </mat-form-field>
</div>
