<main class="forbidden-page" aria-labelledby="forbidden-title">
  <mat-card class="forbidden-card">
    <mat-card-content>
      <div class="forbidden-icon" aria-hidden="true">
        <mat-icon>lock</mat-icon>
      </div>
      <p class="eyebrow">Access restricted</p>
      <h1 id="forbidden-title">You don't have permission to view this page.</h1>
      <p class="description">If you think you should have access, ask your organization administrator to update your permissions.</p>
      <a mat-flat-button color="primary" routerLink="/dashboard">Return to dashboard</a>
    </mat-card-content>
  </mat-card>
</main>
